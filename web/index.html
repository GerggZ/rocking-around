<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>RockingAround Web Dashboard</title>
  <link rel="stylesheet" href="/src/style.css" />
  <script>
    // Opened straight onto a card (camera-app scan or a shared link): keep the
    // card out of sight until it drops in, instead of showing an empty frame.
    if (/[?&](song|card)=/.test(location.search)) document.documentElement.classList.add('arriving');
  </script>
</head>
<body>

  <!-- BLURRED MOUNTAIN BACKGROUND -->
  <div class="mountain-bg"></div>

  <div id="scan-controls"></div>
  <div id="provider-controls"></div>

  <!-- SCROLL LAYER: sits above the background, so its scrollbar floats over the mountains -->
  <div class="page-scroll">

  <!-- MAIN VIEWPORT -->
  <div class="app-viewport">
    
    <!-- 🏔️ MOUNTAIN CARD FRAME -->
    <div class="card-board">
      <img src="/src/assets/climbing-card.png" class="frame-bg" alt="" aria-hidden="true" />
      <div id="card-mount" class="card-content"></div>
    </div>

    <!-- 🎴 EXTERNAL CONTENT MOUNT (SELECT CARD GRID OR BACK BUTTON) -->
    <div id="external-content"></div>

  </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
